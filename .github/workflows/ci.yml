name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go 后端 (gofmt + vet + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
      - name: gofmt 校验
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build -o roundmemo ./cmd/roundmemo
